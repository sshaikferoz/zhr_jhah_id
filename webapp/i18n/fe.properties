# SAP Fiori elements standard-text overrides.
# Loaded through "enhanceI18n" in manifest.json for the List Report and Object Page.
# Keys come from sap/fe/core and sap/fe/templates messagebundle.properties (UI5 1.120).
# "KEY|EntitySet" overrides a text for that entity set only;
# "C_OPERATIONS_ACTION_CONFIRM_MESSAGE|EntitySet|Action" overrides a critical-action confirmation.

# ------------------------------------------------------------
# Save / create messages
# ------------------------------------------------------------
C_TRANSACTION_HELPER_OBJECT_CREATED=Request created successfully
C_TRANSACTION_HELPER_OBJECT_CREATED_ENTITY=Request created successfully
C_TRANSACTION_HELPER_OBJECT_SAVED=Request saved successfully
C_COMMON_OBJECT_SAVED=Request saved successfully

# Footer button of a new (never activated) draft: "Create" -> "Submit"
T_OP_OBJECT_PAGE_CREATE=Submit

T_NEW_OBJECT=New Request
T_NEW_OBJECT|Header=New Request

ST_DRAFT_DATALOSS_POPUP_MESSAGE_CREATE=You haven't saved the request yet. What would you like to do?
ST_DRAFT_DATALOSS_CREATE_ENTITY_TOL=Proceed to create and save the request.
ST_DRAFT_DATALOSS_POPUP_MESSAGE_SAVE=You have made changes to this request. What would you like to do?
ST_DRAFT_DATALOSS_SAVE_DRAFT_TOL=Apply changes to the saved version.

# ------------------------------------------------------------
# Cancel Request (annotated Common.IsActionCritical)
# ------------------------------------------------------------
C_OPERATIONS_ACTION_CONFIRM_MESSAGE|Header|CancelRequest=Do you want to cancel this request?

# ------------------------------------------------------------
# Removing access areas from the request (AppArea table)
# ------------------------------------------------------------
M_COMMON_TABLE_DELETE|AppArea=Remove Access Area
C_TRANSACTION_HELPER_CONFIRM_DELETE_WITH_OBJECTINFO|AppArea=Remove access area "{0}"?
C_TRANSACTION_HELPER_CONFIRM_DELETE_WITH_OBJECTTITLE_ONLY|AppArea=Remove access area "{0}"?
C_TRANSACTION_HELPER_CONFIRM_DELETE_WITH_OBJECTTITLE_SINGULAR|AppArea=Remove this access area?
C_TRANSACTION_HELPER_CONFIRM_DELETE_WITH_OBJECTTITLE_PLURAL|AppArea=Remove the selected access areas?
C_TRANSACTION_HELPER_DELETE_TOAST_SINGULAR|AppArea=Access area removed successfully.
C_TRANSACTION_HELPER_DELETE_TOAST_PLURAL|AppArea=Access areas removed successfully.
